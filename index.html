<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mistério da Floresta Encantada</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b3d2e, #061f18);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .capa {
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 35px;
        }

        .botao {
            display: inline-block;
            padding: 15px 35px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <main class="capa">
        <h1>🌲 O Mistério da Floresta Encantada</h1>

        <p>
            Uma aventura cheia de mistérios, desafios e descobertas espera por você!
        </p>

        <a href="historia.html" class="botao">
            ▶ Iniciar aventura
        </a>
    </main>
