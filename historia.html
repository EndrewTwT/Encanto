<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Floresta - Chapeuzinho Vermelho</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Georgia, serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #142d1f, #07130d);
        color: #fff;
    }

    header {
        background: rgba(0,0,0,.35);
        padding: 18px;
        text-align: center;
        border-bottom: 1px solid #527a5c;
    }

    header h1 {
        color: #ffb7c0;
    }

    .progresso {
        width: 80%;
        max-width: 700px;
        height: 10px;
        background: #263c2c;
        border-radius: 20px;
        margin: 12px auto 0;
        overflow: hidden;
    }

    .barra {
        height: 100%;
        width: 0%;
        background: #e63946;
        border-radius: 20px;
        transition: width 0.4s ease;
    }

    main {
        max-width: 850px;
        margin: 50px auto;
        padding: 20px;
    }

    .cartao {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        backdrop-filter: blur(10px);
        border-radius: 25px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    .cena {
        text-align: center;
        font-size: 90px;
        margin-bottom: 20px;
    }

    h2 {
        text-align: center;
        color: #ffccd2;
        font-size: 32px;
        margin-bottom: 25px;
    }

    .texto {
        font-size: 19px;
        line-height: 1.8;
        color: #eee;
        margin-bottom: 30px;
    }

    .escolhas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
    }

    .escolha {
        border: none;
        padding: 20px;
        border-radius: 15px;
        background: #8e1822;
        color: white;
        font-size: 17px;
        cursor: pointer;
        transition: .3s;
        border: 1px solid #d75a63;
    }

    .escolha:hover {
        background: #c62835;
        transform: translateY(-5px);
    }

    .status {
        margin-top: 25px;
        padding: 15px;
        background: rgba(0,0,0,.25);
        border-radius: 12px;
        text-align: center;
        color: #d9f0dc;
    }

    .voltar {
        display: block;
        width: fit-content;
        margin: 30px auto;
        color: #ffc2c8;
        text-decoration: none;
    }

    #resultado {
        display: none;
        margin-top: 25px;
        padding: 20px;
        background: #183b25;
        border-radius: 15px;
        border-left: 5px solid #67c27b;
        line-height: 1.7;
    }

    #resultado strong {
        font-size: 20px;
        color: #a9efb6;
    }

    .proxima {
        margin-top: 20px;
        background: #c62835;
        border: none;
        padding: 14px 25px;
        border-radius: 20px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
    }

    .proxima:hover {
        background: #e63946;
    }
</style>

</head> <body> <header>
<h1>🔴 Chapeuzinho Vermelho</h1>

<div class="progresso">
    <div class="barra" id="barra"></div>
</div>

</header> <main>
<section class="cartao">

    <div class="cena">🌲🐺🧺</div>

    <h2 id="tituloPergunta">
        A floresta misteriosa
    </h2>

    <p class="texto" id="textoPergunta"></p>

    <div class="escolhas" id="alternativas"></div>

    <div id="resultado"></div>

    <div class="status">
        ❤️ Coragem:
        <span id="coragem">3</span>

        &nbsp; | &nbsp;

        🧺 Cesta: intacta
    </div>

</section>

<a href="index.html" class="voltar">
    ← Voltar para a capa
</a>

</main> <script src="script.js"></script> </body> </html>
